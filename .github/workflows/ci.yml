# CI — typecheck, lint, unit tests, emulator-backed Firestore tests, and the
# Playwright browser scenarios.
# Runs on every push and pull request so "committed but never ran" states
# (missing installs, stale rules, lint regressions) get caught immediately.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc -b

      - name: Lint
        run: npm run lint

      - name: Unit tests (scheduling engine, date utils)
        run: npm run test:unit

  rules-tests:
    name: Firestore rules tests (emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # firebase-tools v15+ requires Java 21 for the Firestore emulator
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Cache Firestore emulator
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}

      - name: Rules permission matrix
        run: npm run test:rules

      - name: Security / PII-leak tests
        run: npm run test:security

      - name: Admin write path (walk-ins, breaks, restore, reschedule, races)
        run: npm run test:admin

      - name: Smoke - client books, owner approves, overlapping walk-in blocked
        run: npm run test:smoke

  e2e:
    name: Browser scenarios (Playwright + emulators)
    runs-on: ubuntu-latest
    # The salon runs on Melbourne time. The tests build every date and clock from
    # explicit Melbourne instants (e2e/helpers.ts), so this is belt and braces,
    # but it keeps Node's own "local" time the same as the browser's.
    env:
      TZ: Australia/Melbourne
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Cache Firestore emulator
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}

      - name: Scenarios from docs/08-test-scenarios.md
        run: npm run test:e2e
